# Decap CMS config. Editors never see this file.
# Nav position lives in each page's frontmatter (folder = unit, parent + order),
# so creating a page here puts it in the sidebar. build.js compiles it all to content.json.
backend:
  name: git-gateway
  branch: main

media_folder: assets
public_folder: assets

# Gives the CMS header a working "View site" link instead of a dead one. Update if
# the site moves to a custom domain.
site_url: https://fascinating-tiramisu-145ac9.netlify.app
display_url: https://fascinating-tiramisu-145ac9.netlify.app

# The site renders content through its own block renderer and stylesheet, so Decap's
# generic preview pane looks nothing like the published page. A preview that lies is
# worse than no preview — teachers should trust the live site instead.
editor:
  preview: false

collections:
  - name: 1-changing-population
    label: "1 · Changing Population"
    label_singular: page
    description: >-
      Click a page to edit it, or "New page" to add one. To add a video, paste the
      YouTube link on a line of its own. To add a picture or a worksheet, drag the
      file straight into the page. Changes go live about a minute after you press
      Publish.
    folder: content/1-changing-population
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Page title, widget: string }
      - name: parent
        label: Sits under
        hint: Leave empty for a top-level page in this unit.
        widget: relation
        collection: 1-changing-population
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
        required: false
      - { name: order, label: Position, hint: Lower numbers come first., widget: number, value_type: int, default: 100 }
      # Provenance only — never shown to students, and nothing should link to the old
      # site any more. Hidden so teachers aren't presented with a field to fill in.
      - { name: source, label: Source, widget: hidden, required: false }
      - name: body
        label: Page content
        widget: markdown
        # Only the buttons build.js can actually render — a button that is shown but
        # unsupported silently publishes raw markup onto the live page. Adding one
        # here means teaching inline()/parseBody in build.js to handle it too.
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list]
        editor_components: [image, youtube]
        # No raw-markdown toggle: a teacher who hits it by accident sees ** and #
        # and has no idea what happened.
        modes: [rich_text]

